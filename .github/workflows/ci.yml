name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # gofmt + vet + race tests (coverage) + golangci-lint + non-blocking
  # govulncheck, via the shared reusable. go + golangci-lint come from
  # mise.toml. Replaces the previous vet/test/lint jobs.
  go:
    uses: nkg/github-actions/.github/workflows/go.yml@v2
    with:
      use-mise: true
      run-golangci-lint: true
      govulncheck-soft: true

  build:
    name: go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o dist/gha-token-server .
      - uses: actions/upload-artifact@v7
        with:
          name: gha-token-server-${{ github.sha }}
          path: dist/gha-token-server
          retention-days: 14

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gha-token-server:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-title:
    name: PR title is conventional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            test
            refactor
            perf
          requireScope: false
